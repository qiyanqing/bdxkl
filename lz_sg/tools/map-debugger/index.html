<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地图调试工具</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>🎮 地图调试工具</h1>
        </header>
        <div class="main-content">
            <aside class="control-panel">
                <!-- 编辑模式 -->
                <section class="panel-section">
                    <h3>编辑模式</h3>
                    <div class="mode-buttons">
                        <button id="btn-add-mode" class="mode-btn active" data-mode="add">添加</button>
                        <button id="btn-select-mode" class="mode-btn" data-mode="select">选择</button>
                        <button id="btn-delete-mode" class="mode-btn" data-mode="delete">删除</button>
                    </div>
                </section>

                <!-- 关卡配置 -->
                <section class="panel-section">
                    <h3>关卡配置</h3>
                    <select id="level-type-select" class="level-type-select">
                        <option value="normal">普通关</option>
                        <option value="bonus">福利关</option>
                    </select>
                    <button id="btn-generate" class="action-btn primary">生成关卡</button>
                </section>

                <!-- 验证结果 -->
                <section class="panel-section">
                    <h3>验证结果</h3>
                    <div id="validation-status" class="validation-status">
                        <span class="status-icon">⏳</span>
                        <span class="status-text">待验证</span>
                    </div>
                    <div id="validation-details" class="validation-details"></div>
                </section>

                <!-- 格子详情 -->
                <section class="panel-section">
                    <h3>格子详情</h3>
                    <div id="grid-info" class="grid-info">
                        <p>鼠标悬停格子查看详情</p>
                    </div>
                </section>

                <!-- 保存关卡 -->
                <section class="panel-section">
                    <h3>保存关卡</h3>
                    <input type="text" id="level-id-input" class="level-input" placeholder="关卡ID (如: 1-1)" maxlength="10">
                    <input type="text" id="level-name-input" class="level-input" placeholder="关卡名称 (如: 第一章第1关)" maxlength="20">
                    <button id="btn-save-level" class="action-btn primary">保存关卡</button>
                </section>

                <!-- 已保存关卡 -->
                <section class="panel-section">
                    <h3>已保存关卡</h3>
                    <div id="saved-levels" class="saved-levels">
                        <p class="hint">暂无保存的关卡</p>
                    </div>
                </section>
            </aside>
            <main class="canvas-container">
                <canvas id="map-canvas"></canvas>
            </main>
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
